<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PartnerNexus - 合作伙伴管理系统</title>
    <meta name="description" content="PartnerNexus - 生态伙伴管理与数字化运营平台" />
    <meta name="theme-color" content="#00288e" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Auto-reload on chunk load failure (stale browser cache)
      (function() {
        var RETRY_KEY = '__cr2';
        var reloaded = sessionStorage.getItem(RETRY_KEY);
        if (reloaded) {
          sessionStorage.removeItem(RETRY_KEY);
          // Clear all caches and force fresh load
          if ('caches' in window) {
            caches.keys().then(function(names) { names.forEach(function(n) { caches.delete(n); }); });
          }
        }
        window.addEventListener('error', function(e) {
          if (e.message && e.message.indexOf('dynamically imported module') !== -1) {
            if (!sessionStorage.getItem(RETRY_KEY)) {
              sessionStorage.setItem(RETRY_KEY, '1');
              location.reload(true);
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
