        'Content-Type': 'application/json',

      log(`API: ${method} ${url}`);
      
      const resp = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${text}`);

      return resp.json();
